[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "1.8.0"
authors = ["Daisy+ <hello@daisy.plus>"]
license = "Apache-2.0"
repository = "https://github.com/J-Palomino/daisy-desktop"
description = "Daisy+ AI agent"

[workspace.lints.clippy]
uninlined_format_args = "allow"

[workspace.dependencies]
rmcp = { version = "0.6.2", features = ["schemars", "auth"] }

# Patch for Windows cross-compilation issue with crunchy
[patch.crates-io]
crunchy = { git = "https://github.com/nmathewson/crunchy", branch = "cross-compilation-fix" }
